name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Backend + frontend security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run security scan (fails on new warn/error findings)
        env:
          # Repository variable: <your backend URL>/functions/v1/security-lint
          SECURITY_SCAN_URL: ${{ vars.SECURITY_SCAN_URL }}
          # Repository secret: same value as the SECURITY_SCAN_TOKEN edge-function secret
          SECURITY_SCAN_TOKEN: ${{ secrets.SECURITY_SCAN_TOKEN }}
        run: node scripts/security-scan.mjs
